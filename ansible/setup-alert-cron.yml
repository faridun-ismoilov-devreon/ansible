---
- name: Setup Smart Alerting Cron
  hosts: kvm_host
  become: true
  tasks:
    - name: Copy alert check script
      copy:
        src: scripts/alert-check.sh
        dest: /usr/local/bin/alert-check.sh
        mode: "0755"

    - name: Create cron job for 15-minute alert check
      cron:
        name: "Infrastructure Smart Alerting"
        minute: "*/15"
        job: "/usr/local/bin/alert-check.sh"
        user: root
        state: present
