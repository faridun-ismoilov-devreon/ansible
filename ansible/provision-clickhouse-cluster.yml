---
- name: Recreate ClickHouse and Keeper VMs
  hosts: kvm_host
  become: true
  vars:
    base_image: ubuntu-24.04-cloudimg.img
    network_name: okdnet
    root_password: clickhouse123
    clickhouse_vms:
      - name: ch-node-01
        mac: "52:54:00:aa:bb:01"
        ip: "192.168.150.140"
        memory: 16384
        vcpus: 8
        disk_size: 100G
      - name: ch-node-02
        mac: "52:54:00:aa:bb:02"
        ip: "192.168.150.141"
        memory: 16384
        vcpus: 8
        disk_size: 100G
      - name: ch-node-03
        mac: "52:54:00:aa:bb:03"
        ip: "192.168.150.142"
        memory: 16384
        vcpus: 8
        disk_size: 100G
    keeper_vms:
      - name: keeper-01
        mac: "52:54:00:aa:bb:11"
        ip: "192.168.150.143"
        memory: 4096
        vcpus: 2
        disk_size: 30G
      - name: keeper-02
        mac: "52:54:00:aa:bb:12"
        ip: "192.168.150.144"
        memory: 4096
        vcpus: 2
        disk_size: 30G
      - name: keeper-03
        mac: "52:54:00:aa:bb:13"
        ip: "192.168.150.145"
        memory: 4096
        vcpus: 2
        disk_size: 30G
    all_vms: "{{ clickhouse_vms + keeper_vms }}"
  tasks:
    - name: Destroy existing VMs if present
      command: "virsh destroy {{ item.name }}"
      failed_when: false
      loop: "{{ all_vms }}"

    - name: Undefine existing VMs if present
      command: "virsh undefine {{ item.name }}"
      failed_when: false
      loop: "{{ all_vms }}"

    - name: Remove old disks
      file:
        path: "/var/lib/libvirt/images/{{ item.name }}.qcow2"
        state: absent
      loop: "{{ all_vms }}"

    - name: Remove old seed ISOs
      file:
        path: "/var/lib/libvirt/images/{{ item.name }}-init.iso"
        state: absent
      loop: "{{ all_vms }}"

    - name: Provision ClickHouse VMs
      include_role:
        name: vm_provisioner
      loop: "{{ clickhouse_vms }}"

    - name: Provision Keeper VMs
      include_role:
        name: vm_provisioner
      loop: "{{ keeper_vms }}"

- name: Configure ClickHouse Keeper cluster
  hosts: clickhouse_keeper
  become: true
  vars:
    clickhouse_admin_password: "clickhouse_admin_2024"
  roles:
    - clickhouse_keeper

- name: Configure ClickHouse cluster
  hosts: clickhouse
  become: true
  vars:
    clickhouse_admin_password: "clickhouse_admin_2024"
    clickhouse_default_password: "clickhouse_default_2024"
  roles:
    - clickhouse
