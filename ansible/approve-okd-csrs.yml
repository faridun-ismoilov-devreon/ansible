---
# Approve pending OKD Certificate Signing Requests (client + kubelet-serving).
# Fixes: "tls: internal error" on kubectl logs/exec and "Approval required" on nodes.
# Run from repo root: ansible-playbook -i ansible/inventory/hosts.ini ansible/approve-okd-csrs.yml
- name: Approve pending OKD CSRs
  hosts: kvm_host
  gather_facts: false
  tasks:
    - name: List pending CSRs
      command: oc get csr
      register: csr_list
      changed_when: false

    - name: Show pending CSRs
      debug:
        var: csr_list.stdout_lines

    - name: Approve all pending CSRs
      shell: oc get csr -o name | xargs -r oc adm certificate approve
      register: approve_result
      changed_when: approve_result.rc == 0

    - name: Show approval result
      debug:
        msg: "Approved CSRs (exit {{ approve_result.rc }})"

    - name: List CSRs after approval
      command: oc get csr
      register: csr_after
      changed_when: false

    - name: Show CSRs after approval
      debug:
        var: csr_after.stdout_lines
