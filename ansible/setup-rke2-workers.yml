---
- name: Install and join RKE2 agent on workers
  hosts: k8s_workers
  gather_facts: false
  vars:
    rke2_version: "v1.32.4+rke2r1"
    rke2_token: "k8s-devreon-shared-token-2026"
    server_endpoint: "https://192.168.150.160:9345"

  tasks:
    - name: Wait for SSH to be available
      wait_for_connection:
        timeout: 120

    - name: Install RKE2 agent binary
      shell: curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE=agent INSTALL_RKE2_VERSION={{ rke2_version }} sh -
      args:
        creates: /usr/local/bin/rke2

    - name: Create /etc/rancher/rke2
      file:
        path: /etc/rancher/rke2
        state: directory

    - name: Write RKE2 agent config
      copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          server: {{ server_endpoint }}
          token: {{ rke2_token }}

    - name: Enable and start rke2-agent
      systemd:
        name: rke2-agent
        enabled: true
        state: started

    - name: Wait for worker to join cluster (check from master-1)
      delegate_to: k8s-master-1
      shell: >
        /var/lib/rancher/rke2/bin/kubectl
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        get node {{ inventory_hostname }}
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: worker_ready
      until: worker_ready.stdout == "True"
      retries: 40
      delay: 15
      failed_when: false

    - name: Show cluster nodes
      delegate_to: k8s-master-1
      shell: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes -o wide
      register: nodes

    - name: Cluster state
      debug:
        msg: "{{ nodes.stdout_lines }}"
