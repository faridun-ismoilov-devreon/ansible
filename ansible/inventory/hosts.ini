[kvm_host]
37.27.173.224 ansible_user=root ansible_ssh_private_key_file=~/.ssh/kvm

[k8s_masters]
k8s-master-1 ansible_host=192.168.150.160
k8s-master-2 ansible_host=192.168.150.161
k8s-master-3 ansible_host=192.168.150.162

[k8s_masters:vars]
ansible_user=root
ansible_ssh_private_key_file=keys/okd-bootstrap-key
ansible_ssh_common_args='-o ProxyCommand="ssh -o StrictHostKeyChecking=no -i ~/.ssh/kvm -W %h:%p root@37.27.173.224" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# alias for lablabs.rke2 role (expects 'masters' group by default)
[masters]
k8s-master-1 ansible_host=192.168.150.160
k8s-master-2 ansible_host=192.168.150.161
k8s-master-3 ansible_host=192.168.150.162

[masters:vars]
ansible_user=root
ansible_ssh_private_key_file=keys/okd-bootstrap-key
ansible_ssh_common_args='-o ProxyCommand="ssh -o StrictHostKeyChecking=no -i ~/.ssh/kvm -W %h:%p root@37.27.173.224" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[k8s_workers]
k8s-worker-1 ansible_host=192.168.150.163
k8s-worker-2 ansible_host=192.168.150.164
k8s-worker-3 ansible_host=192.168.150.165

[k8s_workers:vars]
ansible_user=root
ansible_ssh_private_key_file=keys/okd-bootstrap-key
ansible_ssh_common_args='-o ProxyCommand="ssh -o StrictHostKeyChecking=no -i ~/.ssh/kvm -W %h:%p root@37.27.173.224" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# mt-edge-engine VM exists at 192.168.150.208 but uses a different ssh user/key.
# Uncomment and fill in the correct ansible_user / key before using.
# [edge]
# mt-edge-engine ansible_host=192.168.150.208

[nfs_hosts]
nfs ansible_host=192.168.150.120

[nfs_hosts:vars]
ansible_user=nfs
ansible_ssh_private_key_file=keys/okd-bootstrap-key
ansible_ssh_common_args='-o ProxyCommand="ssh -o ControlMaster=auto -o ControlPath=~/.ansible/cp/jump-%C -o ControlPersist=120s -o StrictHostKeyChecking=no -i ~/.ssh/kvm -W %h:%p root@37.27.173.224" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_ssh_pass=nfsforokd!@#
ansible_become_password=nfsforokd!@#

[psql_hosts]
psql ansible_host=192.168.150.121

[psql_hosts:vars]
ansible_user=psql
ansible_ssh_private_key_file=keys/okd-bootstrap-key
ansible_ssh_common_args='-o ProxyCommand="ssh -o ControlMaster=auto -o ControlPath=~/.ansible/cp/jump-%C -o ControlPersist=120s -o StrictHostKeyChecking=no -i ~/.ssh/kvm -W %h:%p root@37.27.173.224" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_become_password=psqlforokd!@#
