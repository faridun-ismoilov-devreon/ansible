---
- name: Download ClickHouse repository key
  get_url:
    url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
    dest: /tmp/clickhouse-repo.key
    mode: '0644'

- name: Install ClickHouse repository keyring
  command: gpg --batch --yes --dearmor -o /usr/share/keyrings/clickhouse-keyring.gpg /tmp/clickhouse-repo.key
  args:
    creates: /usr/share/keyrings/clickhouse-keyring.gpg

- name: Add ClickHouse apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg] https://packages.clickhouse.com/deb stable main"
    state: present
    filename: clickhouse

- name: Install ClickHouse packages
  apt:
    name:
      - clickhouse-server
      - clickhouse-client
    update_cache: true

- name: Ensure ClickHouse config directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: clickhouse
    group: clickhouse
    mode: '0755'
  loop:
    - /etc/clickhouse-server/config.d
    - /etc/clickhouse-server/users.d

- name: Ensure /etc/hosts has cluster entries
  blockinfile:
    path: /etc/hosts
    create: true
    marker: "# {mark} ANSIBLE CLICKHOUSE CLUSTER"
    block: |
      192.168.150.140 ch-node-01 ch-node-01.local
      192.168.150.141 ch-node-02 ch-node-02.local
      192.168.150.142 ch-node-03 ch-node-03.local
      192.168.150.143 keeper-01 keeper-01.local
      192.168.150.144 keeper-02 keeper-02.local
      192.168.150.145 keeper-03 keeper-03.local

- name: Configure keeper connection
  template:
    src: keeper.xml.j2
    dest: /etc/clickhouse-server/config.d/keeper.xml
    owner: clickhouse
    group: clickhouse
    mode: '0644'
  notify: Restart ClickHouse

- name: Configure cluster topology
  template:
    src: remote_servers.xml.j2
    dest: /etc/clickhouse-server/config.d/remote_servers.xml
    owner: clickhouse
    group: clickhouse
    mode: '0644'
  notify: Restart ClickHouse

- name: Configure macros
  template:
    src: macros.xml.j2
    dest: /etc/clickhouse-server/config.d/macros.xml
    owner: clickhouse
    group: clickhouse
    mode: '0644'
  notify: Restart ClickHouse

- name: Configure network settings
  template:
    src: network.xml.j2
    dest: /etc/clickhouse-server/config.d/network.xml
    owner: clickhouse
    group: clickhouse
    mode: '0644'
  notify: Restart ClickHouse

- name: Deploy admin user
  template:
    src: users_admin.xml.j2
    dest: /etc/clickhouse-server/users.d/admin.xml
    owner: clickhouse
    group: clickhouse
    mode: '0640'
  notify: Restart ClickHouse

- name: Deploy default user
  template:
    src: users_default.xml.j2
    dest: /etc/clickhouse-server/users.d/default.xml
    owner: clickhouse
    group: clickhouse
    mode: '0640'
  notify: Restart ClickHouse

- name: Deploy Prometheus metrics config
  template:
    src: prometheus.xml.j2
    dest: /etc/clickhouse-server/config.d/prometheus.xml
    owner: clickhouse
    group: clickhouse
    mode: '0644'
  notify: Restart ClickHouse

- name: Enable and start ClickHouse
  systemd:
    name: clickhouse-server
    state: started
    enabled: true
