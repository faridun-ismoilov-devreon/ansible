---
- name: Install Java
  apt:
    name: openjdk-21-jdk-headless
    state: present
    update_cache: yes

- name: Create kafka group
  group:
    name: kafka
    state: present

- name: Create kafka user
  user:
    name: kafka
    group: kafka
    shell: /bin/false
    create_home: no

- name: Download Kafka
  get_url:
    url: https://downloads.apache.org/kafka/3.9.0/kafka_2.13-3.9.0.tgz
    dest: /tmp/kafka.tgz

- name: Extract Kafka
  unarchive:
    src: /tmp/kafka.tgz
    dest: /opt
    remote_src: yes
    creates: /opt/kafka_2.13-3.9.0

- name: Download JMX Exporter
  get_url:
    url: https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar
    dest: /opt/kafka_2.13-3.9.0/libs/jmx_prometheus_javaagent.jar
    mode: '0644'

- name: Symlink Kafka directory
  file:
    src: /opt/kafka_2.13-3.9.0
    dest: /opt/kafka
    state: link
    owner: kafka
    group: kafka

- name: Set ownership of Kafka installation
  file:
    path: /opt/kafka_2.13-3.9.0
    state: directory
    owner: kafka
    group: kafka
    recurse: yes

- name: Create log directory
  file:
    path: /var/lib/kafka-logs
    state: directory
    owner: kafka
    group: kafka
    mode: '0755'

- name: Configure server.properties
  template:
    src: server.properties.j2
    dest: /opt/kafka/config/server.properties
    owner: kafka
    group: kafka
  notify: Restart Kafka

- name: Configure JMX Exporter
  template:
    src: jmx_exporter.yaml.j2
    dest: /opt/kafka/config/jmx_exporter.yaml
    owner: kafka
    group: kafka
  notify: Restart Kafka

- name: Configure systemd service
  template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
  notify: Restart Kafka

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Format Kafka Storage (KRaft)
  shell: |
    /opt/kafka/bin/kafka-storage.sh format -t {{ kafka_cluster_id }} -c /opt/kafka/config/server.properties
  args:
    creates: /var/lib/kafka-logs/meta.properties
  vars:
    kafka_cluster_id: "7T8_L9e4R5y6Q1w2E3r4T5"  # Fixed UUID for simplicity

- name: Start and Enable Kafka
  systemd:
    name: kafka
    state: started
    enabled: yes

- name: Wait for Kafka to be ready
  wait_for:
    port: 9092
    delay: 10
    timeout: 60

- name: Create SASL users
  shell: |
    /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 --alter --add-config 'SCRAM-SHA-256=[password=admin-secret-password]' --entity-type users --entity-name admin || true
    /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 --alter --add-config 'SCRAM-SHA-256=[password=app-secret-password]' --entity-type users --entity-name kafka-app || true
  run_once: true
  when: inventory_hostname == groups['kafka'][0]
