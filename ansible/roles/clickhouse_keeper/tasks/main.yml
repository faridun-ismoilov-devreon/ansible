---
- name: Download ClickHouse repository key
  get_url:
    url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
    dest: /tmp/clickhouse-repo.key
    mode: '0644'

- name: Install ClickHouse repository keyring
  command: gpg --batch --yes --dearmor -o /usr/share/keyrings/clickhouse-keyring.gpg /tmp/clickhouse-repo.key
  args:
    creates: /usr/share/keyrings/clickhouse-keyring.gpg

- name: Add ClickHouse apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg] https://packages.clickhouse.com/deb stable main"
    state: present
    filename: clickhouse

- name: Install ClickHouse Keeper package
  apt:
    name: clickhouse-keeper
    update_cache: true

- name: Ensure /etc/hosts has cluster entries
  blockinfile:
    path: /etc/hosts
    create: true
    marker: "# {mark} ANSIBLE CLICKHOUSE CLUSTER"
    block: |
      192.168.150.140 ch-node-01 ch-node-01.local
      192.168.150.141 ch-node-02 ch-node-02.local
      192.168.150.142 ch-node-03 ch-node-03.local
      192.168.150.143 keeper-01 keeper-01.local
      192.168.150.144 keeper-02 keeper-02.local
      192.168.150.145 keeper-03 keeper-03.local

- name: Create config.d directory
  file:
    path: /etc/clickhouse-keeper/config.d
    state: directory
    owner: clickhouse
    group: clickhouse
    mode: '0755'

- name: Ensure keeper data and log directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: clickhouse
    group: clickhouse
    mode: '0755'
  loop:
    - /var/lib/clickhouse-keeper/coordination/log
    - /var/lib/clickhouse-keeper/coordination/snapshots
    - /var/log/clickhouse-keeper

- name: Ensure systemd override directory exists
  file:
    path: /etc/systemd/system/clickhouse-keeper.service.d
    state: directory
    mode: '0755'

- name: Configure systemd override for clickhouse-keeper pid file
  copy:
    dest: /etc/systemd/system/clickhouse-keeper.service.d/override.conf
    content: |
      [Service]
      RuntimeDirectory=
      ExecStart=
      ExecStart=/usr/bin/clickhouse-keeper --config=/etc/clickhouse-keeper/keeper_config.xml --pid-file=/tmp/clickhouse-keeper.pid
  notify: Restart ClickHouse Keeper

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Deploy ClickHouse Keeper configuration
  template:
    src: keeper_config.xml.j2
    dest: /etc/clickhouse-keeper/keeper_config.xml
    owner: clickhouse
    group: clickhouse
    mode: '0644'
  notify: Restart ClickHouse Keeper

- name: Enable and start ClickHouse Keeper
  systemd:
    name: clickhouse-keeper
    state: started
    enabled: true
