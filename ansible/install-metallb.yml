---
- name: Install MetalLB
  hosts: k8s-master-1
  gather_facts: false
  vars:
    kubeconfig: "/etc/rancher/rke2/rke2.yaml"
    kubectl: "/var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml"
    metallb_version: "0.14.9"
    # Свободный диапазон IP в сети 192.168.150.0/24
    lb_pool: "192.168.150.210-192.168.150.220"

  tasks:
    - name: Add MetalLB Helm repo
      shell: |
        helm repo add metallb https://metallb.github.io/metallb
        helm repo update
      changed_when: false

    - name: Install MetalLB
      shell: |
        helm upgrade --install metallb metallb/metallb \
          --version {{ metallb_version }} \
          --namespace metallb-system \
          --create-namespace \
          --kubeconfig {{ kubeconfig }} \
          --wait
      register: metallb_install

    - name: Show install result
      debug:
        msg: "{{ metallb_install.stdout_lines[-3:] }}"

    - name: Configure IP pool and L2 advertisement
      shell: |
        {{ kubectl }} apply -f - <<'EOF'
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: default-pool
          namespace: metallb-system
        spec:
          addresses:
            - {{ lb_pool }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: l2-advert
          namespace: metallb-system
        spec:
          ipAddressPools:
            - default-pool
        EOF
      changed_when: true

    - name: Check MetalLB pods
      shell: "{{ kubectl }} get pods -n metallb-system"
      register: pods
      changed_when: false

    - name: MetalLB pods
      debug:
        msg: "{{ pods.stdout_lines }}"
