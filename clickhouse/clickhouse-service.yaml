---
# ClickHouse Service для доступа из Kubernetes pods
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: default
spec:
  type: ExternalName
  externalName: 192.168.150.1
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
---
# Альтернативный вариант - Headless Service с прямыми IP
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-direct
  namespace: default
spec:
  clusterIP: None
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: clickhouse-direct
  namespace: default
subsets:
- addresses:
  - ip: 192.168.150.1
  ports:
  - name: http
    port: 8123
  - name: native
    port: 9000

