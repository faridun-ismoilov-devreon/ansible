apiVersion: v1
kind: Service
metadata:
  name: kafka-external-metrics
  namespace: monitoring  # Change to your monitoring namespace
  labels:
    app: kafka-external
spec:
  ports:
  - name: metrics
    port: 9404
    protocol: TCP
    targetPort: 9404
  clusterIP: None  # Headless service for external endpoints

---
apiVersion: v1
kind: Endpoints
metadata:
  name: kafka-external-metrics
  namespace: monitoring
  labels:
    app: kafka-external
subsets:
- addresses:
  - ip: 192.168.150.150
    targetRef:
      kind: Node
      name: kafka-01
  - ip: 192.168.150.151
    targetRef:
      kind: Node
      name: kafka-02
  - ip: 192.168.150.152
    targetRef:
      kind: Node
      name: kafka-03
  ports:
  - name: metrics
    port: 9404
    protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-external-monitor
  namespace: monitoring
  labels:
    app: kafka-external
spec:
  selector:
    matchLabels:
      app: kafka-external
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
  namespaceSelector:
    matchNames:
    - monitoring
